
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Asset Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .system-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .login-title {
            font-weight: 700;
            color: #212529;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .btn-login {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .forgot-password {
            font-size: 14px;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Icon -->
            <div class="system-icon">
                A
            </div>

            <!-- Title -->
            <div class="text-center mb-4">
                <h3 class="login-title">Asset Management System</h3>
                <p class="login-subtitle">
                    Sign in to manage your assets
                </p>
            </div>

            <!-- Login Form -->
            <form method="POST">
                {% csrf_token %}
                <!-- Username -->
                <div class="mb-3">
                    <label for="error_msg" class="form-label">{{ msg }} </label>
                    <br>
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Enter your username"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                </div>

                <!-- Remember Me -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="remember">

                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>
                    </div>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-login">
                        Login
                    </button>
                </div>

            </form>

            <!-- Footer Text -->
            <div class="text-center mt-4">
                <small class="text-muted">
                    Secure Asset Management System
                </small>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
